<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — OUR SPACE</title>
  
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body style="min-height: 100vh; background: var(--bg-primary);">

  <!-- Top Space Bar -->
  <header style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-subtle); padding: 0.65rem 0;">
    <div class="container flex justify-between items-center">
      <div class="flex items-center gap-4">
        <a href="/private.html" style="font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600;">BETWEEN</a>
        <div class="flex items-center gap-2">
          <a href="/private.html" class="btn btn-outline btn-sm">← Space</a>
          <a href="/memories.html" class="btn btn-outline btn-sm">Memories</a>
          <a href="/settings.html" class="btn btn-outline btn-sm">Settings</a>
        </div>
      </div>
      
      <button class="panic-btn" onclick="API.panicDisguise()" title="Panic disguise (Esc)">
        <span>📰</span>
        <span>Read News (Esc)</span>
      </button>
    </div>
  </header>

  <!-- Chat Container -->
  <main class="chat-layout">
    
    <!-- Partner Header -->
    <div class="chat-header">
      <div class="chat-partner-info">
        <img class="chat-avatar" id="chat-partner-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" alt="Partner" />
        <div>
          <div class="chat-partner-name" id="chat-partner-name">Partner</div>
          <div class="chat-partner-status" id="chat-partner-status">Connected</div>
        </div>
      </div>

      <div class="chat-header-actions">
        <button class="btn btn-outline btn-sm" onclick="API.showToast('Search active: scroll or filter', 'info')">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </div>

    <!-- Messages Stream -->
    <div class="messages-container" id="chat-messages-stream">
      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 2rem;">Loading conversation...</p>
    </div>

    <!-- Active Reply Banner -->
    <div class="active-reply-banner" id="active-reply-banner">
      <span id="active-reply-text">Replying to message...</span>
      <button onclick="clearReply()" style="color: var(--text-muted);">✕</button>
    </div>

    <!-- Chat Input Area -->
    <div class="chat-input-area">
      
      <!-- Normal Form Controls -->
      <form class="chat-form" id="chat-form-controls" onsubmit="handleSendMessage(event)">
        <!-- File Attachment (Images/Videos) -->
        <label class="chat-action-btn" title="Send Photo or Video" style="cursor: pointer;">
          <input type="file" id="chat-file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileUpload(event)" />
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </label>

        <!-- Text Input -->
        <input type="text" class="chat-input-field" id="chat-text-input" placeholder="Write a message..." autocomplete="off" />

        <!-- Microphone Voice Note Button -->
        <button type="button" class="chat-action-btn" id="chat-mic-btn" title="Hold or click to record voice note">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <!-- Send Button -->
        <button type="submit" class="chat-action-btn chat-send-btn" title="Send Message">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>

      <!-- Voice Recording Bar (Active during recording) -->
      <div class="recording-bar" id="recording-active-bar">
        <div class="recording-indicator">
          <div class="rec-pulse-dot"></div>
          <span class="rec-timer" id="rec-timer-display">0:00</span>
          <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 0.5rem;">Recording voice note...</span>
        </div>
        <div class="rec-actions">
          <button class="btn btn-outline btn-sm" id="rec-cancel-btn" style="color: var(--text-muted);">Cancel</button>
          <button class="btn btn-primary btn-sm" id="rec-stop-btn">Send Voice</button>
        </div>
      </div>

    </div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/demo.js"></script>
</body>
</html>
