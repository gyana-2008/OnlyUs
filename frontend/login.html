<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscriber Access — BETWEEN</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary);">

  <div style="width: 100%; max-width: 440px; padding: 2.5rem; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-family: var(--font-serif); font-size: 2.2rem; letter-spacing: 0.05em;">BETWEEN</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem;">Member & Private Portal</p>
    </div>

    <form id="login-form" onsubmit="handleDirectLogin(event)">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">UID, Email, or Username</label>
        <input type="text" id="login-ident" style="width: 100%;" placeholder="e.g. BT-XXXXXX or email" required />
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
        <input type="password" id="login-pwd" style="width: 100%;" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; margin-bottom: 1.25rem;">Sign In</button>

      <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
        <a href="/" style="color: var(--text-secondary);">← Read News</a>
        <a href="/register.html" style="color: var(--text-accent);">Create Account</a>
      </div>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/demo.js"></script>
  <script>
    async function handleDirectLogin(e) {
      e.preventDefault();
      const ident = document.getElementById('login-ident').value.trim();
      const pwd = document.getElementById('login-pwd').value;

      try {
        const res = await API.post('/api/auth/login', {
          login_identifier: ident,
          password: pwd
        });
        API.setToken(res.access_token);
        API.setUser(res.user);
        API.showToast(`Welcome back, ${res.user.display_name}`, 'success');

        // Automatically unlock private token if user has no PIN yet, otherwise prompt PIN in private page
        if (!res.user.has_pin) {
          const pinRes = await API.post('/api/auth/verify-pin', { pin: '0000' }).catch(() => null);
          if (pinRes && pinRes.private_token) {
            API.setPrivateToken(pinRes.private_token);
          }
        }
        
        setTimeout(() => {
          window.location.href = '/private.html';
        }, 350);
      } catch (err) {}
    }
  </script>
</body>
</html>
